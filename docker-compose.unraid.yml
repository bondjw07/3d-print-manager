services:
  app:
    image: ${APP_IMAGE:-ghcr.io/REPLACE_WITH_YOUR_GITHUB_OWNER/REPLACE_WITH_YOUR_REPO:main}
    container_name: print-portal-app
    restart: unless-stopped
    pull_policy: always
    env_file:
      - .env.production
    environment:
      # Store managed artifacts inside the existing durable uploads mapping.
      PMP_FILE_STORAGE_ROOT: /app/public/uploads/pmp-files
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ${UPLOADS_HOST_PATH:-/mnt/user/appdata/print-portal/uploads}:/app/uploads
      - ${UPLOADS_HOST_PATH:-/mnt/user/appdata/print-portal/uploads}:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  file-worker:
    image: ${APP_IMAGE:-ghcr.io/REPLACE_WITH_YOUR_GITHUB_OWNER/REPLACE_WITH_YOUR_REPO:main}
    container_name: print-portal-file-worker
    restart: unless-stopped
    pull_policy: always
    command: ["npm", "run", "worker:file-processing"]
    env_file:
      - .env.production
    environment:
      PMP_FILE_STORAGE_ROOT: /app/public/uploads/pmp-files
      PMP_FILE_WORKER_CONCURRENCY: ${PMP_FILE_WORKER_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${UPLOADS_HOST_PATH:-/mnt/user/appdata/print-portal/uploads}:/app/uploads
      - ${UPLOADS_HOST_PATH:-/mnt/user/appdata/print-portal/uploads}:/app/public/uploads

  postgres:
    image: postgres:16-alpine
    container_name: print-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - print_portal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  print_portal_postgres:
