services:
  postgres:
    image: postgres:16-alpine
    container_name: print-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: printportal
      POSTGRES_PASSWORD: printportal
      POSTGRES_DB: printportal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printportal -d printportal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
