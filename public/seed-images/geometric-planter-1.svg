<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Geometric Planter</title>
  <desc id="desc">Seed image placeholder for Geometric Planter</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)" />
  <rect width="1200" height="900" fill="url(#grid)" />
  <circle cx="220" cy="190" r="130" fill="rgba(255,255,255,0.18)" />
  <circle cx="1020" cy="760" r="200" fill="rgba(0,0,0,0.12)" />
  <rect x="140" y="160" width="920" height="580" rx="34" fill="rgba(255,255,255,0.92)" />
  <text x="180" y="305" fill="#0f172a" font-size="58" font-family="'Segoe UI', 'Trebuchet MS', sans-serif" font-weight="700">3D Print Management Portal</text>
  <text x="180" y="392" fill="#334155" font-size="44" font-family="'Segoe UI', 'Trebuchet MS', sans-serif" font-weight="600">Geometric Planter</text>
  <text x="180" y="458" fill="#64748b" font-size="30" font-family="'Segoe UI', 'Trebuchet MS', sans-serif">Seeded catalog image placeholder</text>
  <g transform="translate(180,530)">
    <rect width="260" height="70" rx="14" fill="#0f766e" />
    <text x="130" y="45" text-anchor="middle" fill="#ecfeff" font-size="28" font-family="'Segoe UI', 'Trebuchet MS', sans-serif" font-weight="700">Sample Asset</text>
  </g>
</svg>
